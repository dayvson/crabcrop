[package]
name = "crabcrop"
version = "0.13.1"
edition = "2024"
rust-version = "1.96"
description = "On-demand image optimization service in Rust"
license = "MIT"
repository = "https://github.com/dayvson/crabcrop"
include = ["/src/**/*", "/tests/fixtures/**/*", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[workspace]
members = ["crates/crabcrop-url"]

[dependencies]
crabcrop-url = { path = "crates/crabcrop-url", version = "0.13" }
ab_glyph = "0.2"
axum = "0.8"
# Standard base64 with padding for the meta response: the
# placeholder's data URI and ThumbHash, and packed embeddings
# (issue #737), which a hand-written encoder wrote before.
# 0.23 is the release crabcrop-url, c2pa and the HTTP client
# already bring into the tree, so it adds no crate.
base64 = "0.23"
bytes = "1"
# C2PA provenance (issue #173), pinned to the exact release:
# 0.91.0 is the first release that enforces the spec's
# exclusion rule (the October 2026 forgery), and the crate is
# pre-1.0 with breaking trains roughly every two months, so
# upgrades are deliberate. Default features off: the default
# crypto is a vendored OpenSSL build, and this tree has no
# OpenSSL; `rust_native_crypto` swaps in the pure-Rust
# backend. `http_ureq` is the HTTP stack of the SDK's
# blocking calls, the only ones crabcrop makes: a
# configured timestamp authority is reached through a ureq
# agent. Upstream's other default, `http_reqwest`, serves
# only the SDK's async calls, and it compiled a second
# reqwest, 0.12, beside the tree's 0.13 (issue #742). All
# c2pa contact lives in src/provenance.rs.
c2pa = { version = "=0.92.1", default-features = false, features = ["rust_native_crypto", "http_ureq"] }
# The CRC-32 of the PNG chunks crabcrop writes itself, the
# interlaced file and the metadata it injects (issue #737),
# which two hand-written table loops computed before. Already
# in the tree through flate2 and png: it adds no crate.
crc32fast = "1.5"
fast-ssim2 = "0.9"
fast_image_resize = { version = "6.1", features = ["image"] }
# The shared purge walk reads entry headers a bounded number
# at a time (issue #462) with `buffer_unordered`. Already in
# the tree through axum and hyper-util; `alloc` is the one
# feature the combinator needs, and it adds no crate.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hex = "0.4"
hmac = "0.13"
# The accept loop (issue #607) serves each connection
# itself, so it can close idle and half-sent connections
# and cap how many are open: `axum::serve` sets no timer
# and no cap. Both crates are already in the tree through
# axum, and these features add no crate. HTTP/2 stays on:
# `axum::serve` answered HTTP/2 with prior knowledge,
# because other crates in the tree turn on its `http2`
# feature.
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
# Platform-independent cosine for thumbhash, so a placeholder is
# the same bytes on every OS (the system libm differs in the last
# bit between glibc and Apple). Already in the tree via image deps.
libm = "0.2"
# The JPEG XL encoder, at 0.5.7 in the lock. Releases up to
# 0.5.5 panic on some small frames with an alpha channel
# (issue #670; fixed upstream in 0.5.6). A release can change
# the bytes it writes for the same pixels, as 0.5.8 does for
# every output: compare renders before the lock moves, and
# raise RENDERING_VERSION with it when they differ.
jixel = "0.5.7"
# Default features off (issue #466): the defaults compile
# ndarray (unused: tensors go in as shape-and-slice pairs)
# and download-binaries with tls-native, which made OpenSSL
# a build dependency of ort-sys for a runtime this binary
# never downloads. The library is loaded at run time
# (load-dynamic), and api-31 matches the ONNX Runtime 1.31
# that Dockerfile.ai pins. Dropping the default `tracing`
# feature leaves ONNX Runtime on its own logger, which
# writes errors to stderr (`ORT_LOG` sets the level); with
# it, every message went to `tracing`, and this binary
# installs no subscriber, so none was ever seen.
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
jxl-image-rs-integration = "0.8"
jxl = "0.8"
flate2 = "1"
fdeflate = "0.3"
kamadak-exif = "0.6"
# `in_place` is the transform that rewrites a buffer where it
# lies (issue #649): a feature of the crate, no new crate.
moxcms = { version = "0.9", features = ["in_place"] }
# Default features off: the crate's `deflate` feature would let a
# crafted HEIC inflate embedded metadata toward a 1 GiB cap on
# every decode (issue #184); `registry` is the decode path itself.
# `registry` also compiles the crate's AV1, H.264, and H.266
# codecs; src/heic.rs refuses any coded item that is not HEVC
# before the decoder runs (issue #466), so only oxideav-h265
# ever sees source bytes.
# The HEVC decoder src/heic.rs pre-checks with must be the
# one oxideav-heif decodes with: scripts/check_locks.py fails
# CI if Cargo.lock or fuzz/Cargo.lock carries two (issue #552).
oxideav-heif = { version = "=0.0.13", default-features = false, features = ["registry"] }
oxideav-h265 = "=0.0.18"
oxideav-webp = { version = "0.3.1", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# The timestamp authority transport for C2PA signing
# (issue #365): c2pa's own ureq resolver leaves every
# timeout unset, so provenance.rs hands the SDK a
# resolver agent with connect and total timeouts set.
# Same major line the lock already carries for c2pa.
ureq = "3"
resvg = "0.50"
roxmltree = "0.21"
# The CSS engine usvg uses (already in the tree through it):
# the SVG expansion bound (issue #443) matches style sheet
# rules with the same selector code, so it follows the same
# references usvg's cascade resolves. Keep it on usvg's line.
simplecss = "0.2"
sha2 = "0.11"
# The detection memo's keyed digest (issue #677): SipHash-2-4
# with a 128-bit output, the same cost on every CPU. Already
# in the tree through usvg and svgtypes: it adds no crate.
siphasher = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Default features off (issue #466): the defaults compile
# decoders for formats crabcrop does not promise (OpenEXR,
# Radiance HDR, QOI, PNM, DDS, TGA, farbfeld), and the generic
# decode picks its decoder from the source bytes alone, so any
# source or upload reached each one a magic number selects
# (all but TGA, which has none). The list is
# the documented source set (JPEG, PNG, GIF, WebP, TIFF, BMP,
# ICO; AVIF through the avif-decode feature) plus the AVIF
# encoder (avif, nasm) and its threading (rayon).
image = { version = "0.25", default-features = false, features = ["avif", "bmp", "gif", "ico", "jpeg", "nasm", "png", "rayon", "tiff", "webp"] }
# The AVIF encoder the image crate wraps, named here at the
# version the image crate brings into the tree (issue #663):
# opaque 8-bit RGB goes to it directly, with the color
# conversion done in the engine (engine/encode.rs). Default
# features off: the image crate's `nasm` and `rayon` features
# switch on its assembly and its threading, as before. It
# adds no crate.
ravif = { version = "0.13", default-features = false }
# The thread pools AVIF encodes run in (issues #671, #688):
# ravif writes as many tiles as the rayon pool it runs in
# has threads, so the engine runs it in pools of the tile
# count `CRABCROP_AVIF_TILES` sets (engine/encode.rs).
# Already in the tree through ravif and the image crate: it
# adds no crate.
rayon = "1"
# Direct decoder bindings for the two hottest source formats
# (perf wave 3): zune-jpeg is the same decoder the image crate
# wraps for JPEG (already in the tree transitively); calling it
# directly skips the wrapper's copies. The webp crate binds
# libwebp for still WebP decode, bit-identical to image-webp
# and about 3.5x faster; it also carries the lossy WebP encode
# since issue #292 (about 2.7x faster than oxideav-webp, a
# temporary measure until oxideav closes the gap). libwebp-sys
# compiles the vendored C sources and links them statically,
# so no system package or runtime library is involved.
zune-jpeg = "0.5"
zune-core = "0.5"
# JPEG output is written by libjpeg-turbo (issue #668): about
# three times faster than the pure-Rust encoder it replaced,
# and it averages the chroma it subsamples where that encoder
# kept one sample in two or four. It also decodes a JPEG
# source at a half, a quarter or an eighth of its size where
# the first operation is a resize that shrinks it that far
# (issue #653), which zune-jpeg cannot; every other JPEG
# decode stays zune-jpeg's. turbojpeg-sys compiles the
# libjpeg-turbo sources it vendors with cmake and links the
# library statically, so no system package or runtime library
# is involved, and its bindings are pregenerated, so no
# bindgen runs. Default features off. Of the crate's three,
# `cmake` is that vendored build; `pkg-config` only adds a
# way to link a system libturbojpeg instead, which this
# build does not use; and `require-simd` is taken per
# architecture, further down. The unsafe calls stay inside
# the turbojpeg crate.
turbojpeg = { version = "1.5", default-features = false, features = ["cmake"] }
webp = "0.3"
# Secret-holding types zero their bytes when they are dropped:
# the secret settings, the bucket credentials, the signing
# keyring, and the keys derived from them. Already in the
# tree through rustls, c2pa and the RustCrypto crates: it adds
# no crate. Default features only (`alloc`).
zeroize = "1"
# GIF writes go through the gif crate directly (already in the
# tree transitively via image) so quantization can swap from
# NeuQuant to quantizr (issue #294): at 800x533, quantizr with
# Floyd-Steinberg dithering at 1.0 measured about 1.66x faster
# than the speed-10 NeuQuant path, a third smaller, and about
# 3.4 dB higher PSNR. quantizr is pure Rust and actively
# maintained; the palette (and therefore the bytes) changes.
gif = "0.14"
quantizr = "1.4"
png = "0.18"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "fs", "io-util", "signal"] }
# The work handlers leave running (issue #463) is spawned on a
# TaskTracker, so a shutdown can wait for it up to a deadline.
# Already in the tree through h2 (hyper, reqwest). `rt` is the
# feature that carries the tracker; it turns on futures-util's
# default features for tokio-util, which add one build-time
# crate, futures-macro, from the same futures release.
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

# Safe process-group signalling for the video encoder's
# timeout kill (issue #194, audit R2-31): the crate forbids
# unsafe code, so the kill goes through rustix rather than
# a raw libc call. `fs` is for the disk tier's entry open
# (issue #545), which must not wait on a FIFO at an entry
# path, and for the tests that open such a FIFO's write end
# without blocking. `pipe` is for the capacity of the pipes
# to the SVG and AVIF worker (issue #650). `net` is for
# `IPV6_V6ONLY`, which an IPv6 listener turns off to take
# IPv4 connections too (issue #715). None adds a crate.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "fs", "pipe", "net"] }

# libjpeg-turbo's vector code (issue #668) is required on
# the architectures the release binaries and images are
# built for: `require-simd` fails a build that cannot
# assemble it (on x86_64 that takes nasm, as the AVIF
# encoder does). Without the feature the library falls back,
# with a warning cargo does not show, to its plain C paths,
# which write the same bytes more slowly. Any other
# architecture builds what the library has for it, which a
# requirement would refuse where it has no vector code.
[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
turbojpeg = { version = "1.5", default-features = false, features = ["require-simd"] }

[dev-dependencies]
# Property tests (issue #478): tests/proptest_url.rs and
# tests/proptest_crop.rs. Default features off: `fork` and
# `timeout` pull in rusty-fork and tempfile, which the suites
# never use; `std` keeps the regex string strategies and the
# PROPTEST_* environment overrides. A test-only dependency:
# it never enters a normal build.
proptest = { version = "1.12", default-features = false, features = ["std"] }
# The connection watch's deadline tests (issue #639) run on
# tokio's paused clock, which `test-util` provides: every
# order of a connection's events is compared with its
# deadline to the millisecond, and no test waits for one.
# A test-only feature of a crate already in the tree: it
# adds no crate and never enters a normal build.
tokio = { version = "1", features = ["test-util"] }

[features]
# AVIF source decoding, through the image crate's avif-native
# decoder (mp4parse + dav1d). Off by default (issue #141,
# option A): dav1d is a C dependency, found through
# pkg-config: a system libdav1d, or the static dav1d that
# scripts/build_dav1d.sh builds from a pinned, checksummed
# release tarball (issue #596).
# Everything crabcrop ships enables it: the Docker image
# (system libdav1d), the release binaries (the static
# build), and the Homebrew install (which ships the release
# binary).
avif-decode = ["image/avif-native"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

