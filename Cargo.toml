[package]
name = "crabcrop"
version = "0.1.0"
edition = "2024"
description = "On-demand image optimization service in Rust"
license = "MIT"
repository = "https://github.com/dayvson/crabcrop"

[workspace]
members = ["crates/crabcrop-url"]

[dependencies]
crabcrop-url = { path = "crates/crabcrop-url" }
ab_glyph = "0.2"
axum = "0.8"
fast-ssim2 = "0.9"
fast_image_resize = { version = "6.1", features = ["image"] }
hex = "0.4"
hmac = "0.13"
jixel = "0.4"
jpeg-encoder = { version = "0.7", features = ["simd"] }
ort = { version = "2.0.0-rc.15", features = ["load-dynamic"] }
jxl-image-rs-integration = "0.8"
jxl = "0.8"
flate2 = "1"
kamadak-exif = "0.6"
moxcms = "0.8"
oxideav-webp = { version = "0.3.1", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
resvg = "0.48"
roxmltree = "0.21"
sha2 = "0.11"
serde_json = "1"
image = { version = "0.25", features = ["avif"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "fs", "io-util"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

