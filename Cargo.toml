[package]
name = "crabcrop"
version = "0.9.4"
edition = "2024"
rust-version = "1.96"
description = "On-demand image optimization service in Rust"
license = "MIT"
repository = "https://github.com/dayvson/crabcrop"

[workspace]
members = ["crates/crabcrop-url"]

[dependencies]
crabcrop-url = { path = "crates/crabcrop-url" }
ab_glyph = "0.2"
axum = "0.8"
bytes = "1"
# C2PA provenance (issue #173), pinned to the exact release:
# 0.91.0 is the first release that enforces the spec's
# exclusion rule (the October 2026 forgery), and the crate is
# pre-1.0 with breaking trains roughly every two months, so
# upgrades are deliberate. Default features off: the default
# crypto is a vendored OpenSSL build, and this tree has no
# OpenSSL; `rust_native_crypto` swaps in the pure-Rust
# backend. The two HTTP features mirror upstream's default
# set (minus the wasm backends) so a configured timestamp
# authority can be reached. All c2pa contact lives in
# src/provenance.rs.
c2pa = { version = "=0.91.7", default-features = false, features = ["rust_native_crypto", "http_reqwest", "http_ureq"] }
fast-ssim2 = "0.9"
fast_image_resize = { version = "6.1", features = ["image"] }
hex = "0.4"
hmac = "0.13"
jixel = "0.5"
jpeg-encoder = { version = "0.7", features = ["simd"] }
ort = { version = "2.0.0-rc.15", features = ["load-dynamic"] }
jxl-image-rs-integration = "0.8"
jxl = "0.8"
flate2 = "1"
kamadak-exif = "0.6"
moxcms = "0.8"
# Default features off: the crate's `deflate` feature would let a
# crafted HEIC inflate embedded metadata toward a 1 GiB cap on
# every decode (issue #184); `registry` is the decode path itself.
oxideav-heif = { version = "=0.0.13", default-features = false, features = ["registry"] }
oxideav-h265 = "=0.0.15"
oxideav-webp = { version = "0.3.1", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
resvg = "0.49"
roxmltree = "0.21"
sha2 = "0.11"
serde_json = "1"
image = { version = "0.25", features = ["avif", "nasm"] }
# Direct decoder bindings for the two hottest source formats
# (perf wave 3): zune-jpeg is the same decoder the image crate
# wraps for JPEG (already in the tree transitively); calling it
# directly skips the wrapper's copies. The webp crate binds
# libwebp for still WebP decode, bit-identical to image-webp
# and about 3.5x faster; libwebp-sys compiles the vendored C
# sources and links them statically, so no system package or
# runtime library is involved.
zune-jpeg = "0.5"
zune-core = "0.5"
webp = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "fs", "io-util", "signal"] }

# Safe process-group signalling for the video encoder's
# timeout kill (issue #194, audit R2-31): the crate forbids
# unsafe code, so the kill goes through rustix rather than
# a raw libc call.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[features]
# AVIF source decoding, through the image crate's avif-native
# decoder (mp4parse + dav1d). Off by default (issue #141,
# option A): dav1d is a C dependency, found through
# pkg-config (a system libdav1d) or built from vendored
# sources when SYSTEM_DEPS_DAV1D_BUILD_INTERNAL=always.
# Everything crabcrop ships enables it: the Docker image
# (system libdav1d), the release binaries (vendored), and
# the Homebrew install (which ships the release binary).
avif-decode = ["image/avif-native"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

