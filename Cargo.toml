[package]
name = "crabcrop"
version = "0.1.0"
edition = "2024"
description = "On-demand image optimization service in Rust"
license = "MIT"
repository = "https://github.com/dayvson/crabcrop"

[dependencies]
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
image = "0.25"
tokio = { version = "1", features = ["rt", "macros", "net", "time"] }
