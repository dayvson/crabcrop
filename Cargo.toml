[package]
name = "crabcrop"
version = "0.1.0"
edition = "2024"
description = "On-demand image optimization service in Rust"
license = "MIT"
repository = "https://github.com/dayvson/crabcrop"

[dependencies]
ab_glyph = "0.2"
axum = "0.8"
fast-ssim2 = "0.9"
fast_image_resize = { version = "6.1", features = ["image"] }
hex = "0.4"
hmac = "0.12"
jixel = "0.4"
jpeg-encoder = "0.7"
ort = { version = "2.0.0-rc.15", features = ["load-dynamic"] }
jxl-image-rs-integration = "0.8"
kamadak-exif = "0.6"
oxideav-webp = { version = "0.3.1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
resvg = "0.45"
roxmltree = "0.20"
sha2 = "0.10"
image = { version = "0.25", features = ["avif"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time"] }

[dev-dependencies]
serde_json = "1"
