[package]
name = "crabcrop"
version = "0.1.0"
edition = "2024"
description = "On-demand image optimization service in Rust"
license = "MIT"
repository = "https://github.com/dayvson/crabcrop"

[dependencies]
axum = "0.8"
hex = "0.4"
hmac = "0.12"
jixel = "0.4"
ort = { version = "2.0.0-rc.15", features = ["load-dynamic"] }
jxl-image-rs-integration = "0.8"
kamadak-exif = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
image = { version = "0.25", features = ["avif"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time"] }

[dev-dependencies]
serde_json = "1"
