[build-system]
# The license expression below (PEP 639) needs setuptools 77 or newer.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crabcrop-url"
version = "0.16.0"
description = "Build and sign crabcrop image URLs"
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Maxwell Dayvson Da Silva" }]
keywords = ["image", "url", "signing", "hmac", "cdn", "crabcrop"]
# One version classifier per minor release from requires-python on, to
# the newest the suite has run on (tests/test_packaging.py checks that
# the list starts at the floor and has no gap).
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]

[project.optional-dependencies]
seal = ["cryptography>=41"]
# Sealed URLs (issue #255) are the only feature that is not
# standard-library only: AES-256-GCM comes from the
# `cryptography` package, imported lazily by the seal
# functions, so the signing surface stays zero-dependency.

[project.urls]
Homepage = "https://crabcrop.org"
Repository = "https://github.com/dayvson/crabcrop"

[tool.setuptools.packages.find]
where = ["src"]

# The PEP 561 marker: type checkers read the package's inline
# annotations.
[tool.setuptools.package-data]
crabcrop_url = ["py.typed"]
