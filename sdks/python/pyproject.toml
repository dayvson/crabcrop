[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crabcrop-url"
version = "0.9.2"
description = "Build and sign crabcrop image URLs"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Maxwell Dayvson Da Silva" }]
keywords = ["image", "url", "signing", "hmac", "cdn", "crabcrop"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Internet :: WWW/HTTP",
]

[project.optional-dependencies]
seal = ["cryptography>=41"]
# Sealed URLs (issue #255) are the only feature that is not
# standard-library only: AES-256-GCM comes from the
# `cryptography` package, imported lazily by the seal
# functions, so the signing surface stays zero-dependency.

[project.urls]
Homepage = "https://crabcrop.org"
Repository = "https://github.com/dayvson/crabcrop"

[tool.setuptools.packages.find]
where = ["src"]
