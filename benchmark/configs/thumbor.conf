# Thumbor configuration used by the benchmark.
# Base: the October 2026 harness config (HTTP loader, unsafe URLs),
# kept as close to Thumbor defaults as that allows.
LOADER = 'thumbor.loaders.http_loader'
ALLOW_UNSAFE_URL = True
# Result storage stays at the Thumbor default (no result storage).
# October verified that with the file result storage explicitly
# enabled, Thumbor still reprocessed repeat requests in this setup,
# so the default is the honest production starting point here and
# the warm numbers are reported as measured, with a CDN noted as
# the usual production caching layer in the results document.
RESULT_STORAGE_EXPIRATION_SECONDS = 0
