[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app (shell installer; the Homebrew
# formula is generated from the release checksums, see RELEASING.md)
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
# Servers and developer machines: Linux and macOS, both architectures.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# AVIF decoding ships in the release binaries (issue #141,
# option A): dav1d is linked statically, so the tarballs
# stay self-contained. The release workflow builds it with
# scripts/build_dav1d.sh from a pinned, checksummed release
# tarball (issue #596; see docs/release-workflow.yml).
features = ["avif-decode"]
# The release workflow carries repo-maintained jobs (container images,
# registry publishing) beyond what dist generates, so the generated
# file is not expected to match byte for byte.
allow-dirty = ["ci"]

# GitHub retires the macos-14 runner image on 2026-11-02 and its
# capacity reached zero before that date, which stranded the
# aarch64-apple-darwin leg of the v0.9.7 release. Pin that target
# to macos-15 explicitly instead of taking dist's default.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
