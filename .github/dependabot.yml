version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]

  # fuzz/Cargo.lock mirrors the root lock (scripts/check_locks.py fails
  # CI when a shared package differs, issue #552), and the root entry's
  # pull requests move the shared packages; fuzz/README.md refreshes this
  # lock from the root one. An update here bumped crabcrop's own
  # dependencies, through the path dependency, in the root Cargo.toml and
  # this lock alone: that is how the two locks drifted, and the root lock
  # refresh that followed left oxideav-h265 at two versions. So this
  # entry updates only libfuzzer-sys, the fuzz package's one registry
  # dependency that the root lock does not carry.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    allow:
      - dependency-name: "libfuzzer-sys"
    groups:
      cargo-fuzz:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/sdks/typescript"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/sdks/mcp"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/frameworks/hydrogen"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/frameworks/nextjs"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/frameworks/nuxt"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/tests/browser-bundles"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/playground"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/sdks/python"
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
