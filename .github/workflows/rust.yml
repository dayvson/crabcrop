# Rust CI. The live workflow is .github/workflows/rust.yml;
# the API credential cannot push workflow files, so land
# changes to this mirror there through the GitHub web UI
# and keep the two in sync (the same route as
# docs/release-workflow.yml and docs/perf-workflow.yml).
#
# Issue #193 hardening, landed at
# .github/workflows/rust.yml through the web UI as part
# of the v0.1.1 cut: least-privilege permissions, actions
# pinned by SHA, every dependency-resolving cargo command
# run with --locked, and an audit job
# (rustsec/audit-check) so a RUSTSEC advisory against a
# locked dependency fails CI.
name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nasm (rav1e SIMD build)
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check versions
        run: python3 scripts/check_versions.py
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check doc links
        run: cargo doc --no-deps --document-private-items --locked --workspace
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
      - name: Build
        run: cargo build --locked --verbose
      - name: Run tests
        run: cargo test --locked --workspace --verbose
      - name: Install libdav1d (AVIF decode)
        run: sudo apt-get update && sudo apt-get install -y libdav1d-dev
      - name: Run tests with AVIF decode
        run: cargo test --locked --verbose --features avif-decode

  macos:

    # The release ships macOS binaries, and some system
    # APIs exist only on Linux, so a pull request must
    # compile on macOS as well.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the crate compiles on macOS
        run: cargo check --locked --all-targets

  msrv:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nasm (rav1e SIMD build)
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Install the crate's MSRV toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check crabcrop-url at its declared MSRV
        run: cargo +1.88.0 check --locked -p crabcrop-url
      - name: Install the root package's MSRV toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Check crabcrop at its declared MSRV
        run: cargo +1.96.0 check --locked -p crabcrop

  audit:

    runs-on: ubuntu-latest

    # audit-check reports through the Checks API.
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  suites:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nasm (rav1e SIMD build)
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run every non-Rust suite
        run: bash scripts/test_all.sh --skip-rust
