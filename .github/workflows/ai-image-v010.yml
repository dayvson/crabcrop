name: AI image for v0.1.0 (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ai-image:
    name: Build and push the AI image for 0.1.0
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: AI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ai
          build-args: |
            BASE_IMAGE=ghcr.io/dayvson/crabcrop:0.1.0
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dayvson/crabcrop-ai:0.1.0
            ghcr.io/dayvson/crabcrop-ai:latest
