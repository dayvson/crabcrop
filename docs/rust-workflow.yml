# Rust CI. The live workflow is .github/workflows/rust.yml;
# the API credential cannot push workflow files, so land
# changes to this mirror there through the GitHub web UI
# and keep the two in sync (the same route as
# docs/release-workflow.yml and docs/perf-workflow.yml).
#
# Issue #193 hardening, landed at
# .github/workflows/rust.yml through the web UI as part
# of the v0.1.1 cut: least-privilege permissions, actions
# pinned by SHA, every dependency-resolving cargo command
# run with --locked, and an audit job
# (rustsec/audit-check) so a RUSTSEC advisory against a
# locked dependency fails CI.
name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # The daily audit (scheduled-audit below, issue #710): a
  # new advisory against a locked dependency shows up the
  # day it is published, not at the next push. Every other
  # job skips a scheduled run.
  schedule:
    - cron: "21 4 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Line tables, not full debug info: a failing test and a
  # backtrace still name the file and line, and the target
  # directory the cargo cache below saves is a fraction of
  # the size (issue #710).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Every job's timeout-minutes is at least twice its longest
# recent run (issue #543): a hung test fails the job in
# minutes instead of holding it for GitHub's six-hour
# default. The longest recent runs, with no cache to
# restore: build 23.0 minutes, macos 14.5, suites 11.5,
# msrv, notices and audit under 3 (issue #710).
#
# The cargo cache (Swatinem/rust-cache, issue #710) holds
# the registry and the dependencies' build output, keyed by
# the job, the toolchain and the lockfiles. Only a push to
# main saves an entry: a pull request restores main's and
# writes none, so nothing a pull request builds reaches a
# later run. Its keys start with rust-ci-, and the release
# workflow restores no cache at all (scripts/check_workflows.py,
# the cache rule): the binaries a release publishes always
# build from a clean checkout.
jobs:
  build:

    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nasm (rav1e SIMD build)
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rust-ci-v1
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The static dav1d the release links, built the same way
      # (issue #596; see the step of the same name in
      # docs/release-workflow.yml), so the AVIF tests below
      # decode with the dav1d 1.5.1 every shipped binary
      # carries, not the runner's libdav1d (issue #710).
      - name: Build dav1d from the pinned, checksummed tarball
        run: bash scripts/build_dav1d.sh "$RUNNER_TEMP/dav1d"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check versions
        run: python3 scripts/check_versions.py
      # One version of each decoder, and a fuzz lock that
      # matches the root lock (issue #552).
      - name: Check lockfiles
        run: python3 scripts/check_locks.py
      # Actions pinned by SHA, no download piped into a shell,
      # hashed pip installs, dav1d from a checked tarball,
      # publishing behind the release approval, every fuzz
      # run under a memory limit, and no cache in the release
      # (issues #593, #596, #597, #598, #599, #710).
      - name: Check workflows
        run: python3 scripts/check_workflows.py
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check doc links
        run: cargo doc --no-deps --document-private-items --locked --workspace
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
      - name: Build
        run: cargo build --locked --verbose
      - name: Run tests
        run: cargo test --locked --workspace --verbose
      - name: Run tests with AVIF decode
        run: cargo test --locked --verbose --features avif-decode

  macos:

    # The release ships macOS binaries built with the
    # avif-decode feature (dist-workspace.toml), and some
    # system APIs exist only on Linux, so a pull request
    # must build that feature set on macOS and pass the
    # library tests there as well.
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nasm
        run: brew install nasm
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rust-ci-v1
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The static dav1d the release links, built the same way
      # (issue #596): see the step of the same name in
      # docs/release-workflow.yml.
      - name: Build dav1d from the pinned, checksummed tarball
        run: bash scripts/build_dav1d.sh "$RUNNER_TEMP/dav1d"
      - name: Check every target compiles on macOS with the shipped features
        run: cargo check --locked --all-targets --features avif-decode
      - name: Run the library tests on macOS with the shipped features
        run: cargo test --locked --features avif-decode --lib

  msrv:

    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nasm (rav1e SIMD build)
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Install the crate's MSRV toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check crabcrop-url at its declared MSRV
        run: cargo +1.88.0 check --locked -p crabcrop-url
      - name: Install the root package's MSRV toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Check crabcrop at its declared MSRV
        run: cargo +1.96.0 check --locked -p crabcrop

  notices:

    # THIRD-PARTY-NOTICES.md (issue #682) lists every crate the
    # release build compiles, with its license text, and it is
    # what the pinned cargo-about generates from Cargo.lock
    # now: a dependency change regenerates it
    # (scripts/check_notices.py --write). A crate whose license
    # scripts/notices/about.toml does not accept fails here.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The registry and the installed cargo-about: the install
      # below finds the pinned version in place and builds it
      # from source only when the cache has none.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rust-ci-v1
          cache-targets: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # From crates.io with its own lockfile, at the version
      # scripts/check_notices.py pins (CARGO_ABOUT_VERSION).
      - name: Install cargo-about
        run: cargo install --locked --features cli cargo-about@0.9.3
      - name: Check the third-party notices
        run: python3 scripts/check_notices.py --strict

  audit:

    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # From crates.io with its own lockfile, pinned.
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.23.0
      - name: Run cargo audit
        run: cargo audit

  scheduled-audit:

    # The same audit, daily (issue #710). On a scheduled run
    # audit-check files an issue for each advisory it has
    # not filed before, warnings such as an unmaintained
    # crate included, instead of failing a check; the next
    # push's audit job fails on a vulnerability as before.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  semver:

    # crabcrop-url's public API against the last version on
    # crates.io (issue #710): a change that breaks a caller
    # fails here unless the crate's version allows it (a
    # 0.y.z crate breaks only in 0.(y+1).0). It runs when a
    # pull request or a push to main changes
    # crates/crabcrop-url, so the release commit that moves
    # the version runs it too, and the release preflight
    # waits for that run.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether crabcrop-url changed
        id: changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # With no base to compare against, check anyway.
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null \
            && git diff --quiet "$BASE" HEAD -- crates/crabcrop-url; then
            echo "crates/crabcrop-url is unchanged since $BASE"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # The release binary, checked against its pinned SHA-256
      # before it is unpacked. 0.51.0 reads the rustdoc JSON
      # of the toolchain rust-toolchain.toml pins; moving the
      # toolchain may need a newer release here.
      - name: Install cargo-semver-checks
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-semver-checks.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$archive" \
            https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v0.51.0/cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz
          echo "cacadafaa5cd27ae6d05a74a103266917ebab4c5e43c898360e177d4fbf06a65  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" cargo-semver-checks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check crabcrop-url against its last published version
        if: steps.changed.outputs.changed == 'true'
        run: cargo semver-checks --package crabcrop-url

  suites:

    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history and the tags: the rendering
          # version check compares the corpus with the last
          # release tag, and skips itself in a shallow clone.
          fetch-depth: 0
      - name: Install nasm (rav1e SIMD build)
        run: sudo apt-get update && sudo apt-get install -y nasm
      # The debug binary the suites start, and the fuzz smoke,
      # which builds in a workspace of its own.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rust-ci-v1
          workspaces: |
            . -> target
            fuzz -> fuzz/target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run every non-Rust suite
        run: bash scripts/test_all.sh --skip-rust
