# Rust CI. The live workflow is .github/workflows/rust.yml;
# the API credential cannot push workflow files, so land
# changes to this mirror there through the GitHub web UI
# and keep the two in sync (the same route as
# docs/release-workflow.yml and docs/perf-workflow.yml).
#
# Issue #193 hardening, landed at
# .github/workflows/rust.yml through the web UI as part
# of the v0.1.1 cut: least-privilege permissions, actions
# pinned by SHA, every dependency-resolving cargo command
# run with --locked, and an audit job
# (rustsec/audit-check) so a RUSTSEC advisory against a
# locked dependency fails CI.
name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every job's timeout-minutes is at least twice its longest
# recent run (issue #543): a hung test fails the job in
# minutes instead of holding it for GitHub's six-hour
# default.
jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nasm (rav1e SIMD build)
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check versions
        run: python3 scripts/check_versions.py
      # One version of each decoder, and a fuzz lock that
      # matches the root lock (issue #552).
      - name: Check lockfiles
        run: python3 scripts/check_locks.py
      # Actions pinned by SHA, no download piped into a shell,
      # hashed pip installs, dav1d from a checked tarball
      # (issues #593, #596, #597, #598).
      - name: Check workflows
        run: python3 scripts/check_workflows.py
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check doc links
        run: cargo doc --no-deps --document-private-items --locked --workspace
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
      - name: Build
        run: cargo build --locked --verbose
      - name: Run tests
        run: cargo test --locked --workspace --verbose
      - name: Install libdav1d (AVIF decode)
        run: sudo apt-get update && sudo apt-get install -y libdav1d-dev
      - name: Run tests with AVIF decode
        run: cargo test --locked --verbose --features avif-decode

  macos:

    # The release ships macOS binaries built with the
    # avif-decode feature (dist-workspace.toml), and some
    # system APIs exist only on Linux, so a pull request
    # must build that feature set on macOS and pass the
    # library tests there as well.
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nasm
        run: brew install nasm
      # The static dav1d the release links, built the same way
      # (issue #596): see the step of the same name in
      # docs/release-workflow.yml.
      - name: Build dav1d from the pinned, checksummed tarball
        run: bash scripts/build_dav1d.sh "$RUNNER_TEMP/dav1d"
      - name: Check every target compiles on macOS with the shipped features
        run: cargo check --locked --all-targets --features avif-decode
      - name: Run the library tests on macOS with the shipped features
        run: cargo test --locked --features avif-decode --lib

  msrv:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nasm (rav1e SIMD build)
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Install the crate's MSRV toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check crabcrop-url at its declared MSRV
        run: cargo +1.88.0 check --locked -p crabcrop-url
      - name: Install the root package's MSRV toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Check crabcrop at its declared MSRV
        run: cargo +1.96.0 check --locked -p crabcrop

  audit:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    # audit-check reports through the Checks API.
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  suites:

    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history and the tags: the rendering
          # version check compares the corpus with the last
          # release tag, and skips itself in a shallow clone.
          fetch-depth: 0
      - name: Install nasm (rav1e SIMD build)
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run every non-Rust suite
        run: bash scripts/test_all.sh --skip-rust
