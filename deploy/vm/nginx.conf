# crabcrop behind nginx: nginx terminates TLS and proxies
# to crabcrop on port 3000. Certbot (certbot --nginx)
# issues and installs the certificates these two lines
# point at, or use your own.
server {
    listen 443 ssl;
    server_name images.example.com;

    ssl_certificate /etc/letsencrypt/live/images.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/images.example.com/privkey.pem;

    # Uploads are capped at 10 MB by the server
    # (CRABCROP_UPLOAD_MAX_MB); nginx's 1 MB default would
    # cut them off first.
    client_max_body_size 10m;

    # /health is unauthenticated and /metrics exposes
    # traffic and error counters: localhost only, as the
    # main README's Deployment section asks.
    location = /health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
    }
    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
