apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crabcrop.fullname" . }}
  labels:
    {{- include "crabcrop.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "crabcrop.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "crabcrop.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The server drains for shutdownGraceSeconds after
      # SIGTERM and then exits; the pod's grace adds a margin
      # so the kubelet never kills it mid-drain.
      terminationGracePeriodSeconds: {{ add .Values.shutdownGraceSeconds 5 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.ai.enabled }}
          image: "{{ .Values.ai.image.repository }}{{ if .Values.ai.image.digest }}@{{ .Values.ai.image.digest }}{{ else }}:{{ .Values.ai.image.tag }}{{ end }}"
          {{- else }}
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.containerPort | quote }}
            - name: CRABCROP_SHUTDOWN_GRACE_SECS
              value: {{ .Values.shutdownGraceSeconds | quote }}
            {{- if or .Values.existingSecret .Values.secret }}
            - name: CRABCROP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "crabcrop.secretName" . }}
                  key: {{ .Values.secretKey }}
            {{- end }}
            {{- /* previousSecret and gcsCredentials are read in
                 parentheses, so values kept from 0.11.0 or earlier
                 (helm upgrade --reuse-values), which lack them,
                 still render. */}}
            {{- if (.Values.previousSecret).existingSecret }}
            - name: CRABCROP_SECRET_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.previousSecret.existingSecret }}
                  key: {{ .Values.previousSecret.secretKey | default "CRABCROP_SECRET_PREVIOUS" }}
            {{- end }}
            {{- if .Values.metricsToken.existingSecret }}
            - name: CRABCROP_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metricsToken.existingSecret }}
                  key: {{ .Values.metricsToken.secretKey }}
            {{- end }}
            {{- if .Values.presets }}
            - name: CRABCROP_PRESETS_FILE
              value: /etc/crabcrop/presets.txt
            {{- if .Values.onlyPresets }}
            - name: CRABCROP_ONLY_PRESETS
              value: "1"
            {{- end }}
            {{- end }}
            {{- if .Values.resultStorage.enabled }}
            - name: CRABCROP_RESULT_STORAGE_DIR
              value: {{ .Values.resultStorage.mountPath }}
            - name: CRABCROP_RESULT_STORAGE_MAX_MB
              value: {{ .Values.resultStorage.sizeLimitMb | quote }}
            {{- end }}
            {{- if .Values.resultBucket.name }}
            - name: CRABCROP_RESULT_BUCKET
              value: {{ .Values.resultBucket.name | quote }}
            {{- if .Values.resultBucket.prefix }}
            - name: CRABCROP_RESULT_PREFIX
              value: {{ .Values.resultBucket.prefix | quote }}
            {{- end }}
            {{- if .Values.resultBucket.s3Endpoint }}
            - name: CRABCROP_S3_ENDPOINT
              value: {{ .Values.resultBucket.s3Endpoint | quote }}
            {{- end }}
            {{- if .Values.resultBucket.s3Region }}
            - name: CRABCROP_S3_REGION
              value: {{ .Values.resultBucket.s3Region | quote }}
            {{- end }}
            {{- end }}
            {{- /* The AWS keys serve the whole server (s3:// sources and
                 the upload bucket too), so they render without a
                 bucket name. */}}
            {{- if .Values.resultBucket.credentialsSecret }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.resultBucket.credentialsSecret }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.resultBucket.credentialsSecret }}
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.resultBucket.credentialsSecret }}
                  key: AWS_SESSION_TOKEN
                  optional: true
            {{- end }}
            {{- if (.Values.gcsCredentials).existingSecret }}
            - name: CRABCROP_GCS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gcsCredentials.existingSecret }}
                  key: CRABCROP_GCS_ACCESS_KEY
            - name: CRABCROP_GCS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gcsCredentials.existingSecret }}
                  key: CRABCROP_GCS_SECRET_KEY
            {{- end }}
            {{- $allEnv := dict }}
            {{- range $k, $v := .Values.env }}
            {{- $_ := set $allEnv $k $v }}
            {{- end }}
            {{- if .Values.ai.enabled }}
            {{- range $k, $v := .Values.ai.env }}
            {{- $_ := set $allEnv $k $v }}
            {{- end }}
            {{- end }}
            {{- /* A second CRABCROP_SHUTDOWN_GRACE_SECS would win over the
                 one above and leave terminationGracePeriodSeconds short. */}}
            {{- if hasKey $allEnv "CRABCROP_SHUTDOWN_GRACE_SECS" }}
            {{- fail "set shutdownGraceSeconds, not CRABCROP_SHUTDOWN_GRACE_SECS in env or ai.env: the pod's terminationGracePeriodSeconds follows shutdownGraceSeconds" }}
            {{- end }}
            {{- /* A secret in env, ai.env or a plain extraEnv value lands
                 here as plain text. This release warns; a later one
                 refuses it by default. */}}
            {{- $plainSecrets := include "crabcrop.plainSecrets" . | fromYaml }}
            {{- if and $plainSecrets .Values.refusePlainSecrets }}
            {{- $refused := list }}
            {{- range $name, $route := $plainSecrets }}
            {{- $refused = append $refused (printf "%s (set %s)" $name $route) }}
            {{- end }}
            {{- fail (printf "refusePlainSecrets is on, and these secrets are plain values in env, ai.env or extraEnv: %s. Read each from a Secret instead (see the chart README)" (join ", " $refused)) }}
            {{- end }}
            {{- range $name, $route := $plainSecrets }}
            # WARNING: {{ $name }} is a plain value in this spec, readable by anyone who can read the Deployment. Read it from a Secret: set {{ $route }}.
            {{- end }}
            {{- range $k := keys $allEnv | sortAlpha }}
            - name: {{ $k }}
              value: {{ index $allEnv $k | quote }}
            {{- end }}
            {{- range .Values.extraEnv }}
            {{- if eq (get . "name") "CRABCROP_SHUTDOWN_GRACE_SECS" }}
            {{- fail "set shutdownGraceSeconds, not CRABCROP_SHUTDOWN_GRACE_SECS in extraEnv: the pod's terminationGracePeriodSeconds follows shutdownGraceSeconds" }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.presets .Values.resultStorage.enabled (and .Values.ai.enabled .Values.ai.models.existingClaim) }}
          volumeMounts:
            {{- if .Values.presets }}
            - name: presets
              mountPath: /etc/crabcrop/presets.txt
              subPath: presets.txt
              readOnly: true
            {{- end }}
            {{- if .Values.resultStorage.enabled }}
            - name: results
              mountPath: {{ .Values.resultStorage.mountPath }}
            {{- end }}
            {{- if and .Values.ai.enabled .Values.ai.models.existingClaim }}
            - name: models
              mountPath: {{ .Values.ai.models.mountPath }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.presets .Values.resultStorage.enabled (and .Values.ai.enabled .Values.ai.models.existingClaim) }}
      volumes:
        {{- if .Values.presets }}
        - name: presets
          configMap:
            name: {{ include "crabcrop.fullname" . }}-presets
        {{- end }}
        {{- if .Values.resultStorage.enabled }}
        - name: results
          persistentVolumeClaim:
            claimName: {{ .Values.resultStorage.pvc.existingClaim | default (printf "%s-results" (include "crabcrop.fullname" .)) }}
        {{- end }}
        {{- if and .Values.ai.enabled .Values.ai.models.existingClaim }}
        - name: models
          persistentVolumeClaim:
            claimName: {{ .Values.ai.models.existingClaim }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
