# Example overlay: three replicas behind the Service.
#
# Layer it on the production values, do not use it alone:
#
#   helm install crabcrop deploy/helm/crabcrop \
#     -f deploy/helm/crabcrop/values-production.yaml \
#     -f deploy/helm/crabcrop/values-multireplica.yaml \
#     --set resultBucket.name=<your-bucket>
#
# Read the cache note in the chart README first. The result
# cache is per-replica (memory) and per-pod (disk tier), so
# replicas trade cache efficiency, never correctness: expect
# a lower hit rate than a single replica with the same total
# memory, and do not share one disk-tier volume between pods
# unless it is a genuinely shared (RWX) filesystem. The
# shared bucket tier (resultBucket, set above) is what keeps
# the aggregate hit rate whole across replicas.
replicaCount: 3

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

env:
  # The memory tier is per replica: three replicas at the
  # production file's 512 MB would spend 1.5 GB of cluster
  # memory on three partial copies of the working set.
  # Size each replica for its share instead; the bucket
  # tier behind them holds the full set once.
  CRABCROP_CACHE_MAX_MB: "256"

# The disk tier is off in this overlay: the production
# values enable it on the chart's one claim, which is
# ReadWriteOnce, and several replicas cannot mount a
# single-writer volume at once (all but one pod would
# sit unschedulable). The shared bucket tier, required
# by the install command above, is the multi-replica
# tier. Bring the disk tier back only with a
# ReadWriteMany claim or one volume per pod.
resultStorage:
  enabled: false

# Spread replicas across nodes when the cluster allows it.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: crabcrop
          topologyKey: kubernetes.io/hostname
