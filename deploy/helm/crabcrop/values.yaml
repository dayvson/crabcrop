# Default values for crabcrop. Anything the server reads from
# the environment can be set through the free-form `env` map;
# the structured values below cover the common wiring.

replicaCount: 1

image:
  # Release images are published to GHCR, tagged with the
  # release version. Set digest to pin the exact image (a
  # digest takes precedence over the tag), or point the
  # repository at your own build of the repo Dockerfile.
  repository: ghcr.io/dayvson/crabcrop
  tag: "0.9.10"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- The signing secret (CRABCROP_SECRET, 16+ bytes).
# Preferred: reference a Secret you manage yourself.
existingSecret: ""
secretKey: CRABCROP_SECRET
# Trial shortcut: let the chart create the Secret from this
# value instead. Do not use for anything real.
secret: ""

# -- The metrics token (CRABCROP_METRICS_TOKEN), the bearer
# token GET /metrics requires. Without one, /metrics answers
# 403 to everyone. Preferred: a key in an existing Secret,
# the same one as the signing secret in production.
metricsToken:
  existingSecret: ""
  secretKey: CRABCROP_METRICS_TOKEN

# Port the server listens on (the PORT environment variable).
containerPort: 3000

# Presets, name = operations, delivered as a ConfigMap and
# wired through CRABCROP_PRESETS_FILE automatically.
# Example:
#   presets:
#     thumb: "300x200"
#     gray: "filters:grayscale"
presets: {}
onlyPresets: false

# Free-form environment: any CRABCROP_* setting, as strings.
# Example:
#   env:
#     CRABCROP_CACHE_MAX_MB: "512"
#     CRABCROP_METADATA: "preserve"
# The one default below is the evaluation source posture
# (see the README's Configuration section).
env:
  CRABCROP_BLOCK_PRIVATE_SOURCES: "1"

# The disk-backed result cache tier. Off by default: the
# in-memory tier alone serves a single replica well. See the
# chart README before enabling this on multiple replicas.
resultStorage:
  enabled: false
  mountPath: /var/cache/crabcrop
  # Set sizeLimit MB for CRABCROP_RESULT_STORAGE_MAX_MB.
  sizeLimitMb: 512
  pvc:
    existingClaim: ""
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# The shared result cache tier: one S3 bucket (or an
# S3-compatible endpoint) behind the per-replica memory and
# disk tiers, read and written by every replica. This is
# the tier that keeps the cache hit rate whole once you run
# more than one replica. Set name to enable it. Requests
# are signed with the environment-provided AWS credentials
# (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and
# AWS_SESSION_TOKEN, read once at startup); a pod IAM role
# is not picked up, so provide the keys through the env map
# below, backed by a Secret.
resultBucket:
  name: ""
  # Object prefix namespacing this deployment's entries.
  prefix: ""
  # Base URL of an S3-compatible store; empty means AWS.
  s3Endpoint: ""
  # AWS region; empty means the server default (us-east-1).
  s3Region: ""

# AI variant (Dockerfile.ai): switch the image, mount the
# models volume, and point the model env vars at it through
# ai.env. Models are deployment artifacts, never chart
# content.
ai:
  enabled: false
  image:
    repository: ghcr.io/dayvson/crabcrop-ai
    tag: "0.9.10"
    digest: ""
  models:
    existingClaim: ""
    mountPath: /models
  # Example:
  #   env:
  #     CRABCROP_ORT_DYLIB: /models/libonnxruntime.so
  #     CRABCROP_REMOVEBG_MODEL: /models/removebg.onnx
  env: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: crabcrop.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

resources: {}
  # requests:
  #   cpu: 250m
  #   memory: 256Mi
  # limits:
  #   cpu: "2"
  #   memory: 1Gi

podAnnotations: {}
podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
