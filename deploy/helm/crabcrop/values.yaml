# Default values for crabcrop. Anything the server reads from
# the environment can be set through the free-form `env` map,
# except secrets: those come from Secrets you manage, through
# the structured values below or extraEnv and envFrom.

replicaCount: 1

image:
  # Release images are published to GHCR, tagged with the
  # release version. Set digest to pin the exact image (a
  # digest takes precedence over the tag), or point the
  # repository at your own build of the repo Dockerfile.
  repository: ghcr.io/dayvson/crabcrop
  tag: "0.11.0"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- The signing secret (CRABCROP_SECRET, 16+ bytes).
# Preferred: reference a Secret you manage yourself.
existingSecret: ""
secretKey: CRABCROP_SECRET
# Trial shortcut: let the chart create the Secret from this
# value instead. Do not use for anything real.
secret: ""

# -- The metrics token (CRABCROP_METRICS_TOKEN), the bearer
# token GET /metrics requires. Without one, /metrics answers
# 403 to everyone. Preferred: a key in an existing Secret,
# the same one as the signing secret in production.
metricsToken:
  existingSecret: ""
  secretKey: CRABCROP_METRICS_TOKEN

# -- The outgoing signing secret (CRABCROP_SECRET_PREVIOUS)
# during a key rotation window, from a key in an existing
# Secret. Empty leaves it unset. The key IDs are not secret:
# set CRABCROP_SECRET_KEY_ID and
# CRABCROP_SECRET_PREVIOUS_KEY_ID in env.
previousSecret:
  existingSecret: ""
  secretKey: CRABCROP_SECRET_PREVIOUS

# -- The HMAC pair for gs:// sources: an existing Secret with
# the keys CRABCROP_GCS_ACCESS_KEY and CRABCROP_GCS_SECRET_KEY.
gcsCredentials:
  existingSecret: ""

# Port the server listens on (the PORT environment variable).
containerPort: 3000

# How long the server drains after SIGTERM before it exits
# (CRABCROP_SHUTDOWN_GRACE_SECS): requests in flight finish,
# then the shared-tier writes and disk-tier work they left.
# The pod's terminationGracePeriodSeconds is this plus 5, so
# set the grace here: the chart refuses
# CRABCROP_SHUTDOWN_GRACE_SECS in env.
shutdownGraceSeconds: 8

# Presets, name = operations, delivered as a ConfigMap and
# wired through CRABCROP_PRESETS_FILE automatically.
# Example:
#   presets:
#     thumb: "300x200"
#     gray: "filters:grayscale"
presets: {}
onlyPresets: false

# Free-form environment: any CRABCROP_* setting, as strings.
# Each lands in the Deployment as a plain value, so keep
# secrets out of it (see refusePlainSecrets below).
# Example:
#   env:
#     CRABCROP_CACHE_MAX_MB: "512"
#     CRABCROP_METADATA: "preserve"
# The one default below is the evaluation source posture
# (see the README's Configuration section).
env:
  CRABCROP_BLOCK_PRIVATE_SOURCES: "1"

# Env entries passed to the container as written, after the
# env map, so an entry can read a Secret through valueFrom.
# Use it when your Secret's key names differ from the ones
# the structured values expect.
# Example:
#   extraEnv:
#     - name: AWS_SECRET_ACCESS_KEY
#       valueFrom:
#         secretKeyRef:
#           name: my-aws-keys
#           key: secret-access-key
extraEnv: []

# Whole Secrets (or ConfigMaps) whose keys become variables.
# A variable set in env or extraEnv wins over one from here.
# Example:
#   envFrom:
#     - secretRef:
#         name: crabcrop-extra
envFrom: []

# A secret (CRABCROP_SECRET, CRABCROP_SECRET_PREVIOUS,
# AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN,
# CRABCROP_GCS_SECRET_KEY or CRABCROP_METRICS_TOKEN) set in
# env, in ai.env or as an extraEnv entry's value lands in the
# Deployment as plain text. This release renders it with a
# warning; true fails the render instead. A later release
# will refuse it by default.
refusePlainSecrets: false

# The disk-backed result cache tier. Off by default: the
# in-memory tier alone serves a single replica well. See the
# chart README before enabling this on multiple replicas.
resultStorage:
  enabled: false
  mountPath: /var/cache/crabcrop
  # Set sizeLimit MB for CRABCROP_RESULT_STORAGE_MAX_MB.
  sizeLimitMb: 512
  pvc:
    existingClaim: ""
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# The shared result cache tier: one S3 bucket (or an
# S3-compatible endpoint) behind the per-replica memory and
# disk tiers, read and written by every replica. This is
# the tier that keeps the cache hit rate whole once you run
# more than one replica. Set name to enable it. Requests
# are signed with the environment-provided AWS credentials
# (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and
# AWS_SESSION_TOKEN, read once at startup); a pod IAM role
# is not picked up, so provide the keys through
# credentialsSecret below.
resultBucket:
  name: ""
  # Object prefix for this deployment's entries; empty means
  # the bucket root. Deployments that share a bucket need
  # different prefixes (one may contain another).
  prefix: ""
  # Base URL of an S3-compatible store; empty means AWS.
  s3Endpoint: ""
  # AWS region; empty means the server default (us-east-1).
  s3Region: ""
  # An existing Secret with the keys AWS_ACCESS_KEY_ID and
  # AWS_SECRET_ACCESS_KEY, plus AWS_SESSION_TOKEN for
  # temporary credentials. The server uses these keys for
  # s3:// sources and the upload bucket too, so this also
  # works without name.
  credentialsSecret: ""

# AI variant (Dockerfile.ai): switch the image, mount the
# models volume, and point the model env vars at it through
# ai.env. Models are deployment artifacts, never chart
# content.
ai:
  enabled: false
  image:
    repository: ghcr.io/dayvson/crabcrop-ai
    tag: "0.11.0"
    digest: ""
  models:
    existingClaim: ""
    mountPath: /models
  # Example:
  #   env:
  #     CRABCROP_ORT_DYLIB: /models/libonnxruntime.so
  #     CRABCROP_REMOVEBG_MODEL: /models/removebg.onnx
  env: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: crabcrop.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

resources: {}
  # requests:
  #   cpu: 250m
  #   memory: 256Mi
  # limits:
  #   cpu: "2"
  #   memory: 1Gi

podAnnotations: {}
podSecurityContext:
  # The image runs as nobody (65534). fsGroup makes
  # mounted volumes group-writable by that group, so the
  # disk tier can write the result volume it mounts;
  # without it the mount lands root-owned and the tier
  # cannot write.
  fsGroup: 65534
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
