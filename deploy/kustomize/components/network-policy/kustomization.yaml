apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# The chart's networkPolicy.enabled: ingress to the HTTP
# port only, egress to DNS and public IPv4 addresses. Add
# a rule in your overlay for a source, bucket or endpoint
# on a private address. It needs a network plugin that
# enforces NetworkPolicy.
resources:
  - networkpolicy.yaml
