apiVersion: apps/v1
kind: Deployment
metadata:
  name: crabcrop
spec:
  template:
    spec:
      containers:
        - name: crabcrop
          env:
            - name: CRABCROP_RESULT_STORAGE_DIR
              value: /var/cache/crabcrop
            - name: CRABCROP_RESULT_STORAGE_MAX_MB
              value: "512"
          volumeMounts:
            - name: results
              mountPath: /var/cache/crabcrop
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: crabcrop-results
