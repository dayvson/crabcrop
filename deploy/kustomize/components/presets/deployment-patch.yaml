apiVersion: apps/v1
kind: Deployment
metadata:
  name: crabcrop
spec:
  template:
    spec:
      containers:
        - name: crabcrop
          env:
            - name: CRABCROP_PRESETS_FILE
              value: /etc/crabcrop/presets.txt
          volumeMounts:
            - name: presets
              mountPath: /etc/crabcrop/presets.txt
              subPath: presets.txt
              readOnly: true
      volumes:
        - name: presets
          configMap:
            name: crabcrop-presets
