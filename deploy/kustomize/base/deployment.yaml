apiVersion: apps/v1
kind: Deployment
metadata:
  name: crabcrop
  labels:
    app.kubernetes.io/name: crabcrop
    app.kubernetes.io/instance: crabcrop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crabcrop
      app.kubernetes.io/instance: crabcrop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crabcrop
        app.kubernetes.io/instance: crabcrop
    spec:
      # The image runs as nobody (65534). fsGroup makes
      # mounted volumes group-writable by that group, so the
      # result-storage component's claim is writable by the
      # disk tier; without it the mount lands root-owned and
      # the server exits at boot (the chart's
      # podSecurityContext).
      securityContext:
        fsGroup: 65534
      containers:
        - name: crabcrop
          image: ghcr.io/dayvson/crabcrop:0.10.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: CRABCROP_SECRET
              valueFrom:
                secretKeyRef:
                  name: crabcrop
                  key: CRABCROP_SECRET
            # Refuse sources resolving to non-public
            # addresses (or set CRABCROP_ALLOWED_SOURCES).
            - name: CRABCROP_BLOCK_PRIVATE_SOURCES
              value: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
