# The signing secret. This value is a PLACEHOLDER for local
# evaluation only: replace it, or better, do not apply this
# object at all and create the Secret with your own tooling
# (the Deployment only needs a Secret named `crabcrop` with
# the key CRABCROP_SECRET, 16+ bytes). The Helm chart's
# equivalent is its `existingSecret` value.
apiVersion: v1
kind: Secret
metadata:
  name: crabcrop
  labels:
    app.kubernetes.io/name: crabcrop
    app.kubernetes.io/instance: crabcrop
type: Opaque
stringData:
  CRABCROP_SECRET: "local-dev-secret-change-me"
