[package]
name = "crabcrop-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Detached from the main workspace: fuzzing dependencies
# (libfuzzer-sys, sanitizers) never enter a normal build.
[workspace]

[dependencies]
# The server library (issue #417): the harness calls the
# parser, the decoders, the metadata code, and the filters
# the server runs, not copies of them. Cargo.lock in this
# directory pins the same versions as the root lockfile.
crabcrop = { path = ".." }
crabcrop-url = { path = "../crates/crabcrop-url" }
libfuzzer-sys = "0.4"
# The harness builds images and probes dimensions itself;
# same version requirement and features as the root crate.
image = { version = "0.25", features = ["avif", "nasm", "tiff"] }

[features]
# The AVIF decoder the release binaries, the Docker image and
# the Homebrew install ship (issue #476): dav1d behind the
# image crate's avif-native decoder. On by default, so every
# fuzz run covers the decoder the server runs. dav1d is a C
# library: pkg-config finds a system libdav1d, or
# SYSTEM_DEPS_DAV1D_BUILD_INTERNAL=always builds it from
# vendored sources (needs meson, ninja and nasm), as the
# release does. The deterministic smoke in
# scripts/test_all.sh builds with --no-default-features, so
# it needs neither.
default = ["avif-decode"]
avif-decode = ["crabcrop/avif-decode"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "parse_request"
path = "fuzz_targets/parse_request.rs"

[[bin]]
name = "unseal"
path = "fuzz_targets/unseal.rs"

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"

[[bin]]
name = "source_meta"
path = "fuzz_targets/source_meta.rs"

[[bin]]
name = "op_chain"
path = "fuzz_targets/op_chain.rs"
