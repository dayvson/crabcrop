[package]
name = "crabcrop-url"
version = "0.12.0"
edition = "2024"
rust-version = "1.88"
description = "URL building and signing for crabcrop image service URLs"
license = "MIT"
repository = "https://github.com/dayvson/crabcrop"
readme = "README.md"
keywords = ["image", "url", "signing", "hmac", "cdn"]
categories = ["web-programming", "multimedia::images"]

[dependencies]
aes-gcm = "0.11"
base64 = "0.23"
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
sha2 = "0.11"

[dev-dependencies]
serde_json = "1"
# Property tests (issue #478): tests/proptest_sign.rs. Same
# feature set as the root package's; its rust-version (1.88)
# is this crate's MSRV.
proptest = { version = "1.12", default-features = false, features = ["std"] }
